<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sepucuk- Kepada Sang Penerima</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 220'%3E%3Cpath d='M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z' fill='%2312101a' stroke='%23b8924a' stroke-width='9'/%3E%3Crect x='51' y='4' width='18' height='19' rx='3' fill='%238a6440'/%3E%3C/svg%3E">
<!-- Font antik (butuh internet; kalau offline otomatis memakai font cadangan) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --emas:#b8924a;
  --lilin:#5a0f1a;
  --tinta:#2a1d12;
  --teks:#d9ccb0;
  --w:min(86vw,380px);
  --huruf:"IM Fell English","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,#1b1528 0%,#0d0a14 50%,#050408 100%);color:var(--teks);font-family:var(--huruf);overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--emas);outline-offset:3px}

/* ===== SUASANA ===== */
.kabut{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;pointer-events:none}
.kabut i{position:absolute;width:70vw;height:50vh;border-radius:50%;background:radial-gradient(closest-side,rgba(130,110,175,.17),rgba(130,110,175,0));filter:blur(30px);animation:hanyut 30s ease-in-out infinite alternate}
.kabut i:nth-child(1){left:-15vw;top:55vh}
.kabut i:nth-child(2){right:-20vw;top:12vh;animation-duration:38s;animation-direction:alternate-reverse}
.kabut i:nth-child(3){left:25vw;top:68vh;animation-duration:44s}
@keyframes hanyut{from{transform:translateX(-6vw)}to{transform:translateX(10vw)}}
#debu{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.vinyet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)}
main{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:center;justify-content:center}

/* ===== LOADING SCREEN ===== */
#loader{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;align-items:center;justify-content:center}
#loader.terbang{pointer-events:none}
.loader-latar{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 42%,#1d1630 0%,#0d0a14 55%,#050408 100%);transition:opacity .9s ease}
#loader.terbang .loader-latar{opacity:0}
.loader-isi{position:relative;text-align:center;transition:opacity .45s ease}
.botol-apung{padding-top:70px;animation:apung 3.2s ease-in-out infinite}
.botol-miring{transform:rotate(15deg);will-change:transform}
.botol-stage{position:relative;width:130px;height:238px;margin:0 auto}
.halo{position:absolute;left:-60%;top:-25%;width:220%;height:150%;pointer-events:none;background:radial-gradient(closest-side,rgba(150,130,210,.22),rgba(150,130,210,0))}
.lapis{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
/* amplop tergulung di dalam botol: warna sama dengan amplop */
.gulungan{position:absolute;left:42.5%;top:44.5%;width:15%;height:35.5%;border-radius:4px;border:1px solid rgba(184,146,74,.6);background:linear-gradient(90deg,#120e19 0,#3b3150 22%,#5a4c78 50%,#3b3150 78%,#120e19 100%);transform:rotate(-6deg);transition:transform 1.7s cubic-bezier(.4,0,.2,1) .45s}
.gulungan::after,.rull::after,.sisi::after{content:"";position:absolute;left:0;right:0;top:36%;height:9%;background:#7a1a28;box-shadow:0 1px 2px rgba(0,0,0,.5)}
#loader.buka .gulungan{transform:translateY(-210px) rotate(0deg)}
.gabus{transform-box:fill-box;transform-origin:center}
/* gulungan besar di tengah layar, lalu terbelah dua dan membuka ke kiri-kanan */
.rull,.sisi{position:absolute;display:none;border:3px solid rgba(184,146,74,.6)}
.rull{border-radius:12px;background:linear-gradient(90deg,#120e19 0,#3b3150 22%,#5a4c78 50%,#3b3150 78%,#120e19 100%)}
.sisi{top:0;box-shadow:0 0 16px rgba(0,0,0,.55)}
.sisi.kiri{border-right:0;border-radius:12px 0 0 12px;background:linear-gradient(90deg,#120e19 0,#3b3150 44%,#5a4c78 100%)}
.sisi.kanan{border-left:0;border-radius:0 12px 12px 0;background:linear-gradient(90deg,#5a4c78 0,#3b3150 56%,#120e19 100%)}
.loader-teks{margin-top:26px;font-size:1.1rem;letter-spacing:.05em;color:#b9ad94;transition:opacity .6s}
.loader-bar{width:180px;height:3px;margin:12px auto 0;background:rgba(255,255,255,.12);overflow:hidden;transition:opacity .6s}
.loader-bar span{display:block;height:100%;width:0;background:var(--emas);animation:isiBar 3.6s cubic-bezier(.25,.6,.3,1) forwards}
#loader.terbang .loader-teks,#loader.terbang .loader-bar{opacity:0}
@keyframes apung{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes isiBar{to{width:100%}}

/* sebelum loading selesai: yang belum waktunya muncul disembunyikan */
body.memuat .amplop{opacity:0}
/* kertas surat disembunyikan sampai amplop selesai terbuka (saat amplop dianimasikan, kertas bisa tampil di atasnya) */
body.surat-tunggu .surat{visibility:hidden}
body.teks-tunggu .judul,body.teks-tunggu .pembuka,body.teks-tunggu .tombol-bar{opacity:0;pointer-events:none}
body.logo-tunggu .logo-ikon{opacity:0}
body.logo-tunggu .logo span{opacity:0;transform:translateX(-10px)}

/* ===== BAR ATAS & LOGO (logo = botol) ===== */
.bar{position:fixed;top:0;left:0;right:0;z-index:10;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,4vw,32px);background:rgba(7,6,10,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid rgba(184,146,74,.18)}
.logo{display:flex;align-items:center;gap:12px;color:var(--teks);text-decoration:none;font-size:1.4rem;letter-spacing:.05em}
.logo span{transition:opacity .9s ease .1s,transform .9s ease .1s}
.logo-ikon{width:21px;height:38px;flex:none;transform:rotate(15deg);filter:drop-shadow(0 0 8px rgba(150,130,210,.35));transition:opacity .45s ease}
.tombol-bar{background:transparent;color:var(--emas);border:1px solid rgba(184,146,74,.7);padding:.45rem 1.1rem;font-size:1.02rem;letter-spacing:.04em;transition:opacity .9s ease,background .2s}
.tombol-bar:hover{background:rgba(184,146,74,.14)}

/* ===== PANGGUNG & AMPLOP ===== */
.stage{position:relative;width:var(--w);height:250px}
.cahaya{position:absolute;left:50%;top:50%;width:560px;height:460px;max-width:140vw;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(184,146,74,.17),rgba(184,146,74,0));pointer-events:none;animation:nyala 4.5s ease-in-out infinite}
@keyframes nyala{0%,100%{opacity:.8}30%{opacity:1}55%{opacity:.62}78%{opacity:.95}}
.judul{position:absolute;left:0;right:0;bottom:calc(100% + 40px);text-align:center;font-size:clamp(1.5rem,5vw,1.9rem);font-weight:400;letter-spacing:.05em;color:var(--teks);text-shadow:0 0 18px rgba(184,146,74,.4);transition:opacity .9s ease}
.pembuka{position:absolute;left:0;right:0;top:calc(100% + 44px);text-align:center;transition:opacity .9s ease}
.stage.baca .judul,.stage.baca .pembuka,.stage.baca .cahaya{opacity:0;pointer-events:none}
.amplop{position:absolute;top:0;left:0;right:0;bottom:0;transition:opacity 1s ease,transform 1s ease}
.belakang{position:absolute;top:0;left:0;right:0;bottom:0;background:#0f0c15;border-radius:3px;box-shadow:0 22px 60px rgba(0,0,0,.85),0 0 0 1px rgba(184,146,74,.3);z-index:1}
.depan{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:3px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,rgba(0,0,0,0) 2px 5px),linear-gradient(165deg,#2a2234,#16121d);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3}
.alamat{position:absolute;left:0;right:0;top:77%;text-align:center;font-style:italic;font-size:1.05rem;letter-spacing:.06em;color:rgba(184,146,74,.8)}
.garis{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}
.tutup{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(180deg,#322a3f,#1e1828);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:perspective(900px) rotateX(0deg);z-index:4;transition:transform .8s ease}
.tutup svg{position:absolute;top:0;left:0;width:100%;height:100%}
.segel{position:absolute;left:50%;top:56%;width:58px;height:58px;border-radius:50% 46% 52% 48% / 48% 52% 46% 50%;background:radial-gradient(circle at 35% 30%,#8a2433,var(--lilin) 55%,#2e060c);box-shadow:0 3px 10px rgba(0,0,0,.75),inset 0 0 0 2px rgba(0,0,0,.25);transform:translate(-50%,-50%);z-index:5;transition:opacity .4s,transform .5s}
.segel svg{position:absolute;left:15%;top:15%;width:70%;height:70%}
.stage.terbuka .tutup{transform:perspective(900px) rotateX(180deg);z-index:1;transition:transform .8s ease,z-index 0s .4s}
.stage.terbuka .segel{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(25deg)}

/* ===== SURAT ===== */
.surat{position:absolute;left:50%;top:50%;width:calc(var(--w)*.88);height:200px;border-radius:2px;background:radial-gradient(ellipse at 50% 40%,#e0d1ab 0%,#cdbb90 60%,#a89268 100%);box-shadow:0 2px 12px rgba(0,0,0,.7),inset 0 0 50px rgba(70,40,12,.55);z-index:2;transform:translate(-50%,-42%);transition:transform 1s ease,width 1.1s ease,height 1.1s ease}
.surat::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(circle at 18% 82%,rgba(90,55,20,.2),transparent 35%),radial-gradient(circle at 86% 18%,rgba(90,55,20,.16),transparent 30%),radial-gradient(circle at 60% 55%,rgba(90,55,20,.08),transparent 40%)}
.stage.naik .surat{transform:translate(-50%,calc(-50% - 110px))}
.stage.baca .surat{z-index:6;width:min(92vw,560px);height:min(74vh,580px);transform:translate(-50%,-50%)}
.stage.baca .amplop{opacity:0;transform:translateY(70px)}
.kertas{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding:clamp(22px,4.5vw,38px);color:var(--tinta);opacity:0;transition:opacity .6s .5s}
.stage.baca .kertas{opacity:1}
.gulung{flex:1;overflow-y:auto;padding-right:6px}
#isi{white-space:pre-wrap;font-style:italic;font-size:clamp(1.08rem,2.7vw,1.25rem);line-height:1.8}
#isi.mengetik::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--tinta);animation:kedip 1s steps(1) infinite}
@keyframes kedip{50%{opacity:0}}
.tanda{margin-top:1.2em;text-align:right;font-style:italic;font-size:1.1rem;opacity:0;transition:opacity .8s}
.tanda.tampil{opacity:1}
.bawah{position:relative;margin-top:8px;padding-top:12px;min-height:58px;border-top:1px solid rgba(42,29,18,.3)}
.aksi{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;visibility:hidden;transition:opacity .6s}
.aksi.tampil{opacity:1;visibility:visible}
.tombol{background:transparent;color:var(--tinta);border:1px solid #5a4527;padding:.45rem .9rem;font-size:1.02rem}
.tombol:hover{background:rgba(42,29,18,.1)}
.lewati{position:absolute;right:0;top:14px;background:none;border:0;color:#5a4527;text-decoration:underline;font-size:1rem}

/* ===== TOMBOL OPEN LETTER ===== */
.buka{background:rgba(184,146,74,.08);color:#ecdfbd;border:1px solid var(--emas);padding:.75rem 2.3rem;font-size:1.15rem;letter-spacing:.08em;box-shadow:0 0 22px rgba(184,146,74,.2);transition:background .3s,box-shadow .3s}
.buka:hover{background:rgba(184,146,74,.2);box-shadow:0 0 34px rgba(184,146,74,.4)}
.buka:disabled{opacity:.45;cursor:default}

/* ===== FORMULIR ===== */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(3,2,6,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal[hidden]{display:none}
.modal form{background:radial-gradient(ellipse at 50% 30%,#e0d1ab 0%,#cdbb90 65%,#a89268 100%);color:var(--tinta);width:min(100%,480px);padding:22px 24px 24px;border-radius:2px;display:grid;gap:12px;box-shadow:0 10px 50px rgba(0,0,0,.8),inset 0 0 50px rgba(70,40,12,.5)}
.kepala-form{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid rgba(42,29,18,.3)}
.ikon-form{width:20px;height:36px;flex:none;transform:rotate(15deg);color:var(--tinta)}
.kepala-form h2{font-size:1.4rem;font-weight:400;letter-spacing:.03em}
.modal label{font-size:1.05rem}
.modal input[type=text],.modal textarea{width:100%;padding:9px;margin-top:4px;border:1px solid #7d6a45;border-radius:2px;background:rgba(255,248,225,.5);color:var(--tinta);font:inherit;font-size:1.08rem}
.modal textarea{resize:vertical}
.modal .cek{display:flex;gap:8px;align-items:center}
.meter{height:4px;margin-top:8px;background:rgba(42,29,18,.2);overflow:hidden}
.meter-isi{height:100%;width:0;background:#5a4527;transition:width .15s}
.meter-isi.penuh{background:#8a1c2b}
.jumlah{margin-top:4px;text-align:right;font-size:.95rem}
.baris{display:flex;gap:8px;justify-content:flex-end}
.utama{background:var(--tinta);color:#ecdfbd;border-color:var(--tinta)}
.utama:hover{background:#43301c}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);max-width:92vw;text-align:center;background:#15111b;color:var(--teks);border:1px solid rgba(184,146,74,.45);padding:10px 18px;opacity:0;pointer-events:none;transition:.3s;z-index:30}
#toast.tampil{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body class="memuat surat-tunggu teks-tunggu logo-tunggu">

<!-- Ikon botol (setelah amplopnya keluar): dipakai sebagai logo website -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ikon-botol" viewBox="0 0 120 220">
      <defs>
        <clipPath id="klip"><path d="M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z"/></clipPath>
      </defs>
      <g clip-path="url(#klip)">
        <path d="M18 158Q33 150 48 158T78 158T108 158V216H18Z" fill="rgba(80,90,160,.38)"/>
      </g>
      <path d="M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z" fill="rgba(170,160,215,.1)" stroke="rgba(200,195,235,.7)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M30 120V186" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="47" y="20" width="26" height="6" rx="2" fill="rgba(200,195,235,.3)" stroke="rgba(200,195,235,.7)" stroke-width="2"/>
      <rect x="51" y="4" width="18" height="19" rx="3" fill="#8a6440"/>
      <path d="M55 8V20M60 8V20M65 8V20" stroke="#5f4328" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<!-- LOADING SCREEN: gabus lepas, amplop tergulung keluar lalu terbuka, botol terbang jadi logo -->
<div id="loader" role="status" aria-label="Memuat">
  <div class="loader-latar"></div>
  <div class="loader-isi">
    <div class="botol-apung" id="botolApung">
      <div id="terbangX">
        <div class="botol-miring" id="botolMiring">
          <div class="botol-stage" id="botolStage" aria-hidden="true">
            <div class="halo"></div>
            <svg class="lapis" viewBox="0 0 120 220">
              <defs><clipPath id="klip2"><path d="M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z"/></clipPath></defs>
              <g clip-path="url(#klip2)"><path d="M18 158Q33 150 48 158T78 158T108 158V216H18Z" fill="rgba(80,90,160,.38)"/></g>
            </svg>
            <div class="gulungan" id="gulungan"></div>
            <svg class="lapis" viewBox="0 0 120 220">
              <path d="M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z" fill="rgba(170,160,215,.1)" stroke="rgba(200,195,235,.7)" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M30 120V186" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round" fill="none"/>
              <rect x="47" y="20" width="26" height="6" rx="2" fill="rgba(200,195,235,.3)" stroke="rgba(200,195,235,.7)" stroke-width="2"/>
              <g class="gabus" id="gabus">
                <rect x="51" y="4" width="18" height="19" rx="3" fill="#8a6440"/>
                <path d="M55 8V20M60 8V20M65 8V20" stroke="#5f4328" stroke-width="1.5"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <p class="loader-teks">Menunggu Sang Penerima.....</p>
    <div class="loader-bar"><span></span></div>
  </div>
  <div class="rull" id="rull"></div>
  <div class="sisi kiri" id="sisiKiri"></div>
  <div class="sisi kanan" id="sisiKanan"></div>
</div>

<div class="kabut" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="debu" aria-hidden="true"></canvas>
<div class="vinyet" aria-hidden="true"></div>

<!-- BAR ATAS: logo botol + tombol tulis surat -->
<header class="bar">
  <a class="logo" href="#" id="logo" aria-label="Sepucuk, kembali ke awal">
    <svg class="logo-ikon" id="logoIkon" viewBox="0 0 120 220" aria-hidden="true"><use href="#ikon-botol"/></svg>
    <span>Sepucuk</span>
  </a>
  <button class="tombol-bar" id="bukaTulis">Tulis Surat</button>
</header>

<main>
  <div class="stage" id="stage">
    <div class="cahaya"></div>
    <h1 class="judul">Sebuah Pesan Untuk Anda</h1>

    <div class="amplop" id="amplop">
      <div class="belakang"></div>
      <div class="depan"><span class="alamat"></span></div>
      <svg class="garis" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 100V0L50 56L100 0V100" fill="none" stroke="rgba(184,146,74,.35)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="tutup">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0L50 100L100 0" fill="none" stroke="rgba(184,146,74,.5)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
      <div class="segel">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 16C9 9 23 9 28 16C23 23 9 23 4 16Z" fill="none" stroke="rgba(255,205,195,.5)" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="3.6" fill="rgba(255,205,195,.5)"/>
        </svg>
      </div>
    </div>

    <div class="surat">
      <div class="kertas">
        <div class="gulung" id="gulung">
          <p id="isi"></p>
          <p class="tanda" id="tanda"></p>
        </div>
        <div class="bawah">
          <button class="lewati" id="lewati" hidden>Lewati Animasi</button>
          <div class="aksi" id="aksi">
            <button class="tombol" id="simpan">Simpan Surat</button>
            <button class="tombol" id="bagikan">Bagikan Surat</button>
            <button class="tombol" id="tulisLagi">Buat Surat</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pembuka">
      <button class="buka" id="buka">Baca Pesan</button>
    </div>
  </div>
</main>

<!-- FORMULIR -->
<div class="modal" id="tulis" hidden>
  <form id="form">
    <div class="kepala-form">
      <svg class="ikon-form" viewBox="0 0 120 220" aria-hidden="true">
        <path d="M50 24H70V66C70 76 100 84 100 112V190C100 202 92 210 80 210H40C28 210 20 202 20 190V112C20 84 50 76 50 66Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
        <rect x="51" y="4" width="18" height="19" rx="3" fill="#8a6440"/>
      </svg>
      <h2>Buat Surat Anda</h2>
    </div>
    <div>
      <label for="nama">Nama Pengirim</label>
      <input type="text" id="nama" maxlength="40" placeholder="Contoh: Firli">
    </div>
    <label class="cek"><input type="checkbox" id="rahasia"> Sembunyikan Nama Pengirim</label>
    <div>
      <label for="teks">Isi surat</label>
      <textarea id="teks" rows="8" maxlength="1500" required placeholder="Tulis suratmu di sini..."></textarea>
      <div class="meter" aria-hidden="true"><div class="meter-isi" id="meterIsi"></div></div>
      <p class="jumlah" id="jumlah">0 / 1500</p>
    </div>
    <div class="baris">
      <button type="button" class="tombol" id="batal">Batal</button>
      <button type="submit" class="tombol utama">Selesai</button>
    </div>
  </form>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var kurang = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== ISI SURAT BAWAAN (ubah sesukamu) ===== */
var standar = {
  n: "",
  s: true,
  t: "Kepada Yth.Fir\n\nAssalamu'alaikum wr.wb.\n\nHalo fir,gimana kabarnya? semoga Selalu dalam keadaan terbaik.\n\njadi banyak banget hal yang mau gua kasih tau ke lu\n\nPertama,gua mau minta maaf karna mungkin ini ga bakal ngejawab pertanyaan lu"
};

var data = standar, node, timer, tm = [];

/* ===== LOADING SCREEN =====
   1) gabus terlepas, amplop tergulung naik keluar dari botol
   2) gulungan membesar ke tengah layar, lalu terbelah dua dan membuka ke kiri-kanan jadi amplop
   3) botol mengecil, terbang ke pojok kiri atas, dan menjadi logo */
(function () {
  var l = $("loader"), B = document.body, isi = l.querySelector(".loader-isi");
  var t0 = Date.now(), mulai = false, usai = false;
  var T_NAIK = 2250, T_JALAN = 950, T_GELAR = 1500, T_BOTOL = 1500, JEDA_BOTOL = 150;

  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function potong(i) { return "inset(-140px " + i + "px)"; }

  function bersih() {
    if (usai) return;
    usai = true;
    var a = $("amplop");
    a.style.clipPath = ""; a.style.transition = "";
    B.classList.remove("memuat", "surat-tunggu", "teks-tunggu", "logo-tunggu");
    if (l.parentNode) l.parentNode.removeChild(l);
  }

  function gelar(c) {
    var kiri = $("sisiKiri"), kanan = $("sisiKanan"), amp = $("amplop");
    var W = c.W, H = c.H, cx = c.cx, cy = c.cy, w0 = c.w0;
    var gaya = "display:block;top:" + (cy - H / 2) + "px;height:" + H + "px;";
    kiri.style.cssText = gaya + "left:" + (cx - w0 / 2) + "px;width:" + (w0 / 2) + "px";
    kanan.style.cssText = gaya + "left:" + cx + "px;width:" + (w0 / 2) + "px";
    amp.style.transition = "none";
    amp.style.clipPath = potong(W / 2);          // amplop belum terlihat sama sekali
    $("rull").style.display = "none";            // gulungan utuh digantikan dua sisinya
    B.classList.remove("memuat");
    var mulaiT = performance.now(), teksOk = false;
    function bingkai(now) {
      if (usai) return;
      var t = Math.max(0, Math.min(1, (now - mulaiT) / T_GELAR));
      var p = ease(Math.min(1, t / .86));         // 0..1: seberapa terbuka
      var q = ease(Math.max(0, (t - .86) / .14)); // setelah terbuka: bayangan amplop ikut muncul
      var h = W / 2 * p, w = (w0 / 2) * (1 - p) + 4 * p;   // gulungan makin tipis
      amp.style.clipPath = potong(W / 2 - h - 140 * q);
      kiri.style.left = (cx - h - w) + "px"; kiri.style.width = w + "px";
      kanan.style.left = (cx + h) + "px"; kanan.style.width = w + "px";
      var o = 1 - Math.max(0, (t - .78) / .22);
      kiri.style.opacity = o; kanan.style.opacity = o;
      if (!teksOk && t > .7) { teksOk = true; B.classList.remove("teks-tunggu"); }
      if (t < 1) { requestAnimationFrame(bingkai); return; }
      amp.style.clipPath = ""; amp.style.transition = "";
      B.classList.remove("surat-tunggu", "teks-tunggu");   // kertas surat baru boleh ada setelah amplop utuh
      bersih();
    }
    requestAnimationFrame(bingkai);
  }

  function terbang() {
    if (mulai || usai) return;
    mulai = true;
    if (kurang || !l.animate) { bersih(); return; }

    var apung = $("botolApung"), kx = $("terbangX"), botol = $("botolMiring"), st = $("botolStage");
    var g = $("gulungan"), rull = $("rull"), logo = $("logoIkon"), amp = $("amplop"), gb = $("gabus");

    // posisi melayang saat ini (supaya berhenti melayang tanpa tersentak)
    var f = 0;
    try { f = new DOMMatrix(getComputedStyle(apung).transform).m42 || 0; } catch (e) {}

    // ukur semuanya sebelum ada yang bergerak
    var gr = g.getBoundingClientRect(), gw = g.offsetWidth, gh = g.offsetHeight;
    var gx = gr.left + gr.width / 2, gy = gr.top + gr.height / 2;
    var sr = st.getBoundingClientRect(), lr = logo.getBoundingClientRect(), ar = amp.getBoundingClientRect();
    var W = amp.offsetWidth, H = amp.offsetHeight, cx = ar.left + ar.width / 2, cy = ar.top + ar.height / 2;
    var w0 = H * gw / gh;                          // lebar gulungan saat sudah sebesar amplop
    var dx = (lr.left + lr.width / 2) - (sr.left + sr.width / 2);
    var dy = (lr.top + lr.height / 2) - ((sr.top + sr.height / 2) - f);
    var k = parseFloat(getComputedStyle(logo).height) / st.offsetHeight;   // logo adalah SVG: tidak punya offsetHeight

    l.classList.add("terbang");                    // latar dan teks memudar

    // gulungan: dari mulut botol berjalan ke tengah layar sambil membesar dan menegak
    rull.style.cssText = "display:block;left:" + (cx - w0 / 2) + "px;top:" + (cy - H / 2) + "px;width:" + w0 + "px;height:" + H + "px";
    g.style.visibility = "hidden";
    rull.animate([
      { transform: "translate(" + (gx - cx) + "px," + (gy - cy) + "px) rotate(15deg) scale(" + (gh / H) + ")" },
      { transform: "translate(0px,0px) rotate(0deg) scale(1)" }
    ], { duration: T_JALAN, easing: "cubic-bezier(.5,0,.2,1)", fill: "both" });

    // botol: berhenti melayang halus, lalu mengecil dan terbang melengkung ke logo
    apung.style.animation = "none";
    apung.animate([{ transform: "translateY(" + f + "px)" }, { transform: "translateY(0px)" }],
      { duration: 800, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
    kx.animate([{ transform: "translateX(0px)" }, { transform: "translateX(" + dx + "px)" }],
      { duration: T_BOTOL, delay: JEDA_BOTOL, easing: "cubic-bezier(.65,0,.35,1)", fill: "both" });   // geser mendatar sedikit tertinggal
    botol.animate([
      { transform: "translateY(0px) scale(1) rotate(15deg)" },
      { transform: "translateY(" + dy + "px) scale(" + k + ") rotate(15deg)" }
    ], { duration: T_BOTOL, delay: JEDA_BOTOL, easing: "cubic-bezier(.45,0,.2,1)", fill: "both" });   // naik dan mengecil lebih dulu
    l.querySelector(".halo").animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 900, delay: JEDA_BOTOL, fill: "forwards" });
    // gabus kembali menutup botol selama terbang, supaya sama dengan logo
    gb.animate([
      { transform: "translate(0px,0px) rotate(0deg)", opacity: 0 },
      { transform: "translate(0px,0px) rotate(0deg)", opacity: 1 }
    ], { duration: 500, delay: JEDA_BOTOL + T_BOTOL * .45, easing: "ease-out", fill: "both" });

    // botol mendarat: logo asli muncul tepat di tempatnya, botol di loading memudar
    setTimeout(function () { B.classList.remove("logo-tunggu"); }, JEDA_BOTOL + T_BOTOL - 250);
    setTimeout(function () { isi.style.opacity = "0"; }, JEDA_BOTOL + T_BOTOL - 60);

    // gulungan tiba di tengah -> membuka jadi amplop
    setTimeout(function () { gelar({ W: W, H: H, cx: cx, cy: cy, w0: w0 }); }, T_JALAN);
  }

  function buka() {
    if (kurang) { bersih(); return; }
    l.classList.add("buka");                       // gulungan mulai naik dari botol
    var gb = $("gabus");
    if (gb.animate) gb.animate([
      { transform: "translate(0px,0px) rotate(0deg)", opacity: 1 },
      { transform: "translate(0px,-3px) rotate(-5deg)", opacity: 1, offset: .12 },
      { transform: "translate(0px,-5px) rotate(5deg)", opacity: 1, offset: .24 },
      { transform: "translate(5px,-40px) rotate(24deg)", opacity: 1, offset: .6 },
      { transform: "translate(15px,-78px) rotate(58deg)", opacity: 0 }
    ], { duration: 1100, easing: "cubic-bezier(.25,.6,.3,1)", fill: "forwards" });
    setTimeout(terbang, T_NAIK);
  }
  function siap() { setTimeout(buka, Math.max(0, 1100 - (Date.now() - t0))); }

  if (document.readyState === "complete") siap(); else window.addEventListener("load", siap);
  setTimeout(bersih, 12000); // cadangan: loading selalu hilang
})();

/* ===== SURAT DISIMPAN DI DALAM TAUTAN (#s=...) ===== */
function enkode(d) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function dekode(k) {
  try {
    k = k.replace(/-/g, "+").replace(/_/g, "/");
    while (k.length % 4) k += "=";
    return JSON.parse(decodeURIComponent(escape(atob(k))));
  } catch (e) { return null; }
}
function jadwal(fn, ms) { tm.push(setTimeout(fn, ms)); }

/* ===== MUAT SURAT & RESET ADEGAN ===== */
function muat() {
  var m = location.hash.match(/^#s=(.+)$/);
  var d = m && dekode(m[1]);
  if (d && typeof d.t === "string" && d.t.trim()) {
    data = { n: String(d.n || "").slice(0, 40), s: !!d.s, t: d.t.slice(0, 1500) };
  } else {
    data = standar;
  }
  tm.forEach(clearTimeout); tm = []; clearTimeout(timer);
  $("stage").className = "stage";
  $("buka").disabled = false;
  $("isi").textContent = ""; $("isi").className = "";
  $("tanda").className = "tanda";
  $("tanda").textContent = data.s ? "\u2014 Pengirim merahasiakan namanya" : "\u2014 " + (data.n || "Seseorang");
  $("aksi").className = "aksi";
  $("lewati").hidden = true;
  $("gulung").scrollTop = 0;
}

/* ===== ANIMASI MENGETIK ===== */
function ketik() {
  var teks = data.t, i = 0, kotak = $("gulung");
  node = document.createTextNode("");
  $("isi").textContent = ""; $("isi").appendChild(node); $("isi").className = "mengetik";
  $("lewati").hidden = false;
  if (kurang) { selesaiKetik(); return; }
  (function langkah() {
    if (i >= teks.length) { selesaiKetik(); return; }
    var c = teks.charAt(i++);
    node.data += c;
    kotak.scrollTop = kotak.scrollHeight;
    timer = setTimeout(langkah, c === "\n" ? 380 : (".,!?".indexOf(c) > -1 ? 240 : 30 + Math.random() * 34));
  })();
}
function selesaiKetik() {
  clearTimeout(timer);
  if (node) node.data = data.t;
  $("isi").className = "";
  $("lewati").hidden = true;
  $("tanda").classList.add("tampil");
  $("aksi").classList.add("tampil");
  $("gulung").scrollTop = $("gulung").scrollHeight;
}
$("lewati").onclick = selesaiKetik;

/* ===== TOMBOL OPEN LETTER ===== */
$("buka").onclick = function () {
  var s = $("stage");
  this.disabled = true;
  s.classList.add("terbuka");
  jadwal(function () { s.classList.add("naik"); }, 900);
  jadwal(function () { s.classList.add("baca"); jadwal(ketik, 1300); }, 2000);
};

/* ===== LOGO: KEMBALI KE AWAL ===== */
$("logo").onclick = function (e) {
  e.preventDefault();
  if (location.hash) location.hash = ""; else muat();
};

/* ===== SIMPAN, BAGIKAN, TOAST ===== */
function toast(teks) {
  var t = $("toast"); t.textContent = teks; t.classList.add("tampil");
  clearTimeout(toast.w); toast.w = setTimeout(function () { t.classList.remove("tampil"); }, 2800);
}
$("simpan").onclick = function () {
  var isi = data.t + "\n\n" + (data.s ? "(Pengirim merahasiakan namanya)" : "\u2014 " + (data.n || "Seseorang"));
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([isi], { type: "text/plain;charset=utf-8" }));
  a.download = "surat.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast("Surat disimpan sebagai surat.txt");
};
function salin(u) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(u).then(function () { toast("Tautan disalin"); }, function () { prompt("Salin tautan ini:", u); });
  } else { prompt("Salin tautan ini:", u); }
}
$("bagikan").onclick = function () {
  var u = location.href.split("#")[0] + "#s=" + enkode(data);
  if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
    navigator.share({ title: "Sebuah surat untukmu", url: u }).catch(function () {});
  } else { salin(u); }
};

/* ===== TULIS SURAT SENDIRI ===== */
function hitungHuruf() {
  var n = $("teks").value.length;
  $("meterIsi").style.width = (n / 1500 * 100) + "%";
  $("meterIsi").className = "meter-isi" + (n > 1350 ? " penuh" : "");
  $("jumlah").textContent = n + " / 1500";
}
function bukaForm() { $("tulis").hidden = false; hitungHuruf(); $("teks").focus(); }
$("teks").addEventListener("input", hitungHuruf);
$("bukaTulis").onclick = bukaForm;
$("tulisLagi").onclick = bukaForm;
$("batal").onclick = function () { $("tulis").hidden = true; };
document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("tulis").hidden = true; });
$("form").onsubmit = function (e) {
  e.preventDefault();
  var t = $("teks").value.trim();
  if (!t) return;
  var s = $("rahasia").checked;
  var n = $("nama").value.trim().slice(0, 40) || "Seseorang";
  var k = "#s=" + enkode({ n: s ? "" : n, s: s, t: t.slice(0, 1500) });
  $("tulis").hidden = true;
  if (location.hash === k) muat(); else location.hash = k;
  toast("Surat siap. Buka suratnya, lalu bagikan tautannya.");
};
window.addEventListener("hashchange", muat);

/* ===== ANIMASI DEBU ===== */
(function () {
  var cv = $("debu"), cx = cv.getContext("2d"), P = [], W, H;
  function ukur() {
    W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
    var n = Math.max(40, Math.min(120, Math.round(W * H / 14000)));
    P = [];
    for (var i = 0; i < n; i++) P.push({
      x: Math.random() * W, y: Math.random() * H, r: .4 + Math.random() * 1.4,
      vx: (Math.random() - .5) * .12, vy: -(.03 + Math.random() * .15), f: Math.random() * 6.28,
      c: Math.random() < .3 ? "#e0c58a" : "#cfc6e6"
    });
  }
  function gambar(t) {
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      p.x += p.vx + Math.sin(t * .0004 + p.f) * .12;
      p.y += p.vy;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
      cx.globalAlpha = .1 + .45 * (.5 + .5 * Math.sin(t * .0015 + p.f));
      cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
    if (!kurang) requestAnimationFrame(gambar);
  }
  ukur(); requestAnimationFrame(gambar);
  window.addEventListener("resize", ukur);
})();

muat();
</script>
</body>
</html>
